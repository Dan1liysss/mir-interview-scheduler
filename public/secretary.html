<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Панель секретаря — школа «Мир» (концепт)</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/style.css">
<style>
  .wrap-wide { max-width: 920px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
  .toolbar-actions { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
  .filter-chip {
    border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-soft);
    padding: 0.4rem 0.85rem; border-radius: 999px; font-size: 0.8125rem; cursor: pointer;
  }
  .filter-chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
  .filter-chip:hover:not([aria-pressed="true"]) { border-color: var(--accent); color: var(--ink); }
  .search-row { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 1rem; }
  .search-row input, .search-row select {
    font-family: 'PT Sans', sans-serif; font-size: 0.875rem; padding: 0.55rem 0.8rem;
    border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); color: var(--ink);
  }
  .search-row input:focus, .search-row select:focus { outline: none; border-color: var(--accent); background: var(--surface); }
  .search-row input { flex: 1; min-width: 180px; }
  .stats-bar { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
  .stat {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 0.5rem 0.85rem; font-size: 0.8125rem; color: var(--ink-soft);
  }
  .stat strong { color: var(--ink); font-family: 'PT Mono', monospace; font-variant-numeric: tabular-nums; }
  .stat-urgent { border-color: var(--warn); color: var(--warn); background: var(--warn-soft); }
  .stat-urgent strong { color: var(--warn); }
  .req-list { display: grid; gap: 0.75rem; }
  .req-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 1rem 1.15rem;
    cursor: pointer; transition: box-shadow 0.15s, transform 0.1s, border-color 0.15s;
  }
  .req-card:hover { box-shadow: var(--shadow); transform: translateY(-1px); }
  .req-card.unseen { border-left: 3px solid var(--accent); }
  .req-card.urgent { border-left: 3px solid var(--warn); }
  .urgent-tag {
    font-size: 0.7rem; font-weight: 700; color: var(--warn); background: var(--warn-soft);
    text-transform: uppercase; letter-spacing: 0.03em; padding: 0.2rem 0.5rem; border-radius: 999px;
  }
  .req-card-head { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
  .req-card-badges { display: flex; gap: 0.4rem; align-items: center; flex-shrink: 0; }
  .req-card-title { font-weight: 700; }
  .req-card-sub { font-size: 0.8125rem; color: var(--ink-faint); margin-top: 0.2rem; }
  .req-card-preview { font-size: 0.8125rem; color: var(--ink-soft); font-style: italic; margin-top: 0.5rem; }
  .req-detail { border-top: 1px solid var(--line); margin-top: 0.85rem; padding-top: 0.85rem; display: none; }
  .req-detail.open { display: block; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 0.3rem 0.75rem; font-size: 0.875rem; margin-bottom: 1rem; }
  .kv .k { color: var(--ink-faint); }
  .decide-form { display: none; border-top: 1px solid var(--line); padding-top: 0.85rem; margin-top: 0.85rem; }
  .decide-form.open { display: block; }
  #loginCard { max-width: 380px; margin: 3rem auto; }
  #notifyBanner {
    display: none; align-items: center; justify-content: space-between; gap: 1rem;
    background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 10px;
    padding: 0.75rem 1rem; margin-bottom: 1.25rem; font-size: 0.875rem;
  }
</style>
</head>
<body>
<div class="banner">
  <span class="dot"></span>
  <span><strong>Концепт-прототип</strong> — демонстрация панели секретаря школы «Мир»</span>
</div>

<div id="loginView" class="wrap-wide">
  <div class="card" id="loginCard">
    <h2 style="font-size:1.2rem; margin-bottom:1rem;">Вход в панель секретаря</h2>
    <div class="field">
      <label for="password">Пароль</label>
      <input type="password" id="password" autocomplete="current-password">
    </div>
    <button class="btn btn-primary" id="loginBtn" style="width:100%;">Войти</button>
    <span class="error-msg" id="loginError"></span>
  </div>
</div>

<div id="panelView" class="wrap-wide" style="display:none;">
  <div id="notifyBanner">
    <span>Разреши уведомления браузера, чтобы не пропустить новую заявку, даже если вкладка свёрнута.</span>
    <button class="btn btn-secondary" id="enableNotifyBtn">Разрешить</button>
  </div>

  <div class="toolbar">
    <h1 style="font-size:1.4rem;">Заявки на собеседование</h1>
    <div class="toolbar-actions">
      <button class="btn btn-secondary" id="exportBtn">Скачать CSV</button>
      <button class="btn btn-secondary" id="logoutBtn">Выйти</button>
    </div>
  </div>

  <div id="statsBar" class="stats-bar"></div>

  <div class="toolbar-actions" style="margin-bottom:1rem;">
    <button class="filter-chip" data-filter="" aria-pressed="true">Все</button>
    <button class="filter-chip" data-filter="pending">Ждут ответа</button>
    <button class="filter-chip" data-filter="proposed_alternative">Предложено время</button>
    <button class="filter-chip" data-filter="confirmed">Подтверждено</button>
    <button class="filter-chip" data-filter="rejected">Отклонено</button>
  </div>

  <div class="search-row">
    <input type="search" id="searchInput" placeholder="Поиск по имени ребёнка или родителя…">
    <select id="sortSelect">
      <option value="created_desc">Сначала новые заявки</option>
      <option value="created_asc">Сначала старые заявки</option>
      <option value="interview_asc">По дате собеседования</option>
    </select>
  </div>

  <div id="listEmpty" class="center-note" style="display:none;">Заявок пока нет.</div>
  <div id="reqList" class="req-list"></div>
</div>

<script>
const el = (id) => document.getElementById(id);
const STATUS_LABELS = {
  pending: ['Ждёт ответа', 'badge-pending'],
  confirmed: ['Подтверждено', 'badge-confirmed'],
  proposed_alternative: ['Предложено время', 'badge-proposed'],
  rejected: ['Отклонено', 'badge-rejected'],
  expired: ['Истекло', 'badge-expired'],
};
const REMINDER_LABELS = {
  '1_hour': 'За 1 час до собеседования',
  '3_hours': 'За 3 часа',
  '1_day': 'За 1 день',
  '3_days': 'За 3 дня',
};
const POLL_MS = 12000;

let sessionToken = localStorage.getItem('secretary_session') || null;
let currentFilter = '';
let searchQuery = '';
let sortOrder = 'created_desc';
let allRequests = []; // последний полученный от сервера полный список (без клиентских фильтров)
let knownUnseenIds = new Set();
let openDetailIds = new Set(); // раскрытые сейчас карточки — пока хоть одна открыта, автообновление списка на паузе
let firstLoadDone = false;
let audioCtx = null;

const URGENT_HOURS = 48; // "скоро" — собеседование в пределах этого окна

function fmtDate(d) {
  if (!d) return '';
  const [y, m, day] = d.split('-').map(Number);
  return new Date(y, m - 1, day).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
}
function fmtDateTime(ts) {
  return new Date(ts).toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
}
function childFullName(r) {
  return `${r.child_last_name} ${r.child_first_name}`;
}

// ---------------- auth ----------------

function showLogin() {
  el('loginView').style.display = 'block';
  el('panelView').style.display = 'none';
}
function showPanel() {
  el('loginView').style.display = 'none';
  el('panelView').style.display = 'block';
}

async function apiFetch(path, options = {}) {
  const resp = await fetch(path, {
    ...options,
    headers: { ...(options.headers || {}), Authorization: `Bearer ${sessionToken}` },
  });
  if (resp.status === 401) {
    sessionToken = null;
    localStorage.removeItem('secretary_session');
    showLogin();
    throw new Error('Сессия истекла, войдите заново.');
  }
  return resp;
}

el('loginBtn').addEventListener('click', async () => {
  el('loginError').classList.remove('show');
  const password = el('password').value;
  try {
    const resp = await fetch('/api/secretary/login', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ password }),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || 'Ошибка входа');
    sessionToken = data.session_token;
    localStorage.setItem('secretary_session', sessionToken);
    el('password').value = '';
    showPanel();
    startPolling();
    maybeShowNotifyBanner();
  } catch (e) {
    el('loginError').textContent = e.message;
    el('loginError').classList.add('show');
  }
});
el('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') el('loginBtn').click(); });

el('logoutBtn').addEventListener('click', () => {
  sessionToken = null;
  localStorage.removeItem('secretary_session');
  showLogin();
});

// ---------------- notifications ----------------

function maybeShowNotifyBanner() {
  if ('Notification' in window && Notification.permission === 'default') {
    el('notifyBanner').style.display = 'flex';
  }
}
el('enableNotifyBtn').addEventListener('click', async () => {
  await Notification.requestPermission();
  el('notifyBanner').style.display = 'none';
});

function beep() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 720;
    gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.2, audioCtx.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.35);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.4);
  } catch {}
}

function notifyNewRequests(count) {
  beep();
  document.title = `(${count}) Новая заявка — Панель секретаря`;
  if ('Notification' in window && Notification.permission === 'granted') {
    new Notification('Новая заявка на собеседование', {
      body: `Непросмотренных заявок: ${count}`,
    });
  }
}
function resetTitle() {
  document.title = 'Панель секретаря — школа «Мир» (концепт)';
}

// ---------------- list rendering ----------------

document.querySelectorAll('.filter-chip').forEach((chip) => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.filter-chip').forEach((c) => c.setAttribute('aria-pressed', 'false'));
    chip.setAttribute('aria-pressed', 'true');
    currentFilter = chip.dataset.filter;
    openDetailIds.clear(); // список перестраивается заново — открытых карточек больше нет
    renderFilteredList();
  });
});

el('searchInput').addEventListener('input', () => {
  searchQuery = el('searchInput').value.trim();
  openDetailIds.clear();
  renderFilteredList();
});

el('sortSelect').addEventListener('change', () => {
  sortOrder = el('sortSelect').value;
  renderFilteredList();
});

async function loadList(isPoll = false) {
  try {
    const resp = await apiFetch('/api/secretary/requests');
    const data = await resp.json();
    allRequests = data.requests;
    updateUnseenTracking(allRequests, isPoll);
    renderFilteredList();
  } catch (e) {
    // сессия истекла — apiFetch уже показал логин
  }
}

function updateUnseenTracking(requests, isPoll) {
  const currentUnseen = new Set(requests.filter((r) => !r.seen_by_secretary).map((r) => r.id));
  if (isPoll && firstLoadDone) {
    const newlyArrived = [...currentUnseen].filter((id) => !knownUnseenIds.has(id));
    if (newlyArrived.length > 0) notifyNewRequests(currentUnseen.size);
  }
  knownUnseenIds = currentUnseen;
  if (currentUnseen.size === 0) resetTitle();
  firstLoadDone = true;
}

function isUrgent(r) {
  if (!['pending', 'proposed_alternative'].includes(r.status)) return false;
  const dateStr = r.status === 'proposed_alternative' ? r.proposed_date : r.preferred_date;
  const timeStr = r.status === 'proposed_alternative' ? r.proposed_time : r.preferred_time;
  if (!dateStr) return false;
  const target = new Date(`${dateStr}T${timeStr || '00:00'}:00`);
  const diffHours = (target.getTime() - Date.now()) / 36e5;
  return diffHours >= 0 && diffHours <= URGENT_HOURS;
}

function matchesSearch(r, q) {
  if (!q) return true;
  const hay = `${r.child_last_name} ${r.child_first_name} ${r.parent_name}`.toLowerCase();
  return hay.includes(q.toLowerCase());
}

function sortRequests(list) {
  const copy = [...list];
  if (sortOrder === 'created_asc') copy.sort((a, b) => a.created_at.localeCompare(b.created_at));
  else if (sortOrder === 'interview_asc') {
    copy.sort((a, b) => `${a.preferred_date}${a.preferred_time}`.localeCompare(`${b.preferred_date}${b.preferred_time}`));
  } else copy.sort((a, b) => b.created_at.localeCompare(a.created_at)); // created_desc — по умолчанию
  return copy;
}

function renderFilteredList() {
  let list = allRequests;
  if (currentFilter) list = list.filter((r) => r.status === currentFilter);
  list = list.filter((r) => matchesSearch(r, searchQuery));
  list = sortRequests(list);
  renderStats(allRequests);
  renderCards(list);
}

function renderStats(requests) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const newToday = requests.filter((r) => {
    const c = new Date(r.created_at); c.setHours(0, 0, 0, 0);
    return c.getTime() === today.getTime();
  }).length;
  const pendingCount = requests.filter((r) => r.status === 'pending').length;
  const urgentCount = requests.filter(isUrgent).length;

  el('statsBar').innerHTML = `
    <span class="stat"><strong>${requests.length}</strong> всего</span>
    <span class="stat"><strong>${newToday}</strong> новых сегодня</span>
    <span class="stat"><strong>${pendingCount}</strong> ждут ответа</span>
    ${urgentCount ? `<span class="stat stat-urgent"><strong>${urgentCount}</strong> собеседование в ближайшие ${URGENT_HOURS}ч</span>` : ''}
  `;
}

function updateEmptyState(visibleCount) {
  const emptyEl = el('listEmpty');
  if (visibleCount > 0) { emptyEl.style.display = 'none'; return; }
  emptyEl.style.display = 'block';
  if (searchQuery) {
    emptyEl.textContent = `Ничего не найдено по запросу «${searchQuery}».`;
  } else if (currentFilter) {
    const label = (STATUS_LABELS[currentFilter] || [currentFilter])[0].toLowerCase();
    emptyEl.textContent = `Нет заявок со статусом «${label}».`;
  } else {
    emptyEl.textContent = 'Заявок пока нет — как только родитель отправит заявку, она появится здесь.';
  }
}

function renderCards(requests) {
  const listEl = el('reqList');
  updateEmptyState(requests.length);
  listEl.innerHTML = '';
  for (const r of requests) {
    listEl.appendChild(renderCard(r));
  }
}

function cardClassName(r) {
  if (isUrgent(r)) return 'req-card urgent';
  if (!r.seen_by_secretary) return 'req-card unseen';
  return 'req-card';
}

function renderCard(r) {
  const card = document.createElement('div');
  card.className = cardClassName(r);

  const [label, cls] = STATUS_LABELS[r.status] || [r.status, 'badge-pending'];

  card.innerHTML = `
    <div class="req-card-head">
      <div>
        <div class="req-card-title">${escapeHtml(childFullName(r))} — ${escapeHtml(r.grade)}</div>
        <div class="req-card-sub">Запрошено: ${fmtDate(r.preferred_date)}, ${r.preferred_time} · заявка от ${fmtDateTime(r.created_at)}</div>
      </div>
      <div class="req-card-badges">
        ${isUrgent(r) ? '<span class="urgent-tag">Скоро</span>' : ''}
        <span class="badge ${cls}">${label}</span>
      </div>
    </div>
    ${r.why_school ? `<div class="req-card-preview">«${escapeHtml(truncate(r.why_school, 110))}»</div>` : ''}
    <div class="req-detail" id="detail-${r.id}"></div>
  `;

  card.addEventListener('click', (e) => {
    if (e.target.closest('.decide-form') || e.target.closest('button') || e.target.closest('input') || e.target.closest('textarea')) return;
    toggleDetail(r.id, card);
  });

  return card;
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function truncate(s, max) {
  s = String(s ?? '');
  return s.length > max ? s.slice(0, max).trim() + '…' : s;
}

async function toggleDetail(id, card) {
  const detailEl = card.querySelector('.req-detail');
  const isOpen = detailEl.classList.contains('open');
  if (isOpen) {
    detailEl.classList.remove('open');
    openDetailIds.delete(id);
    return;
  }

  openDetailIds.add(id); // ставит автообновление списка на паузу, пока карточка открыта
  await refreshCardDetail(id, card);
  card.classList.remove('unseen');

  // помечен просмотренным на бэкенде — уберём из счётчика непрочитанных локально
  knownUnseenIds.delete(id);
  if (knownUnseenIds.size === 0) resetTitle();
}

async function refreshCardDetail(id, card) {
  const resp = await apiFetch(`/api/secretary/requests/${id}`);
  const r = await resp.json();

  card.className = cardClassName(r);
  const [label, cls] = STATUS_LABELS[r.status] || [r.status, 'badge-pending'];
  const badgeEl = card.querySelector('.req-card-head .badge');
  if (badgeEl) { badgeEl.textContent = label; badgeEl.className = 'badge ' + cls; }

  const detailEl = card.querySelector('.req-detail');
  detailEl.innerHTML = renderDetailHtml(r);
  detailEl.classList.add('open');
  wireDetailActions(detailEl, r, card);

  // элемент карточки мог замениться (className сброшен) — .req-detail остаётся тем же узлом,
  // но чтобы список карточек не терял актуальность (превью, срочность и т.п.) — держим allRequests в курсе
  const idx = allRequests.findIndex((x) => x.id === r.id);
  if (idx !== -1) allRequests[idx] = r;
  renderStats(allRequests);

  return r;
}

function renderDetailHtml(r) {
  const actionsDisabled = ['confirmed', 'rejected', 'expired'].includes(r.status);
  const isRejected = r.status === 'rejected';

  let actionsHtml = '';
  if (!actionsDisabled) {
    actionsHtml = `
      <div style="display:flex; gap:0.6rem; flex-wrap:wrap;">
        <button class="btn btn-primary act-approve">Подтвердить это время</button>
        <button class="btn btn-secondary act-propose-toggle">Предложить другое время</button>
        <button class="btn btn-danger act-reject">Отклонить</button>
      </div>
      <div class="decide-form propose-form">
        <div class="form-row two-col">
          <div class="field"><label>Дата</label><input type="date" class="propose-date"></div>
          <div class="field"><label>Время</label><input type="time" class="propose-time"></div>
        </div>
        <div class="field"><label>Заметка родителю (необязательно)</label><input type="text" class="propose-note"></div>
        <button class="btn btn-primary act-propose-submit">Отправить предложение</button>
      </div>
    `;
  } else if (isRejected) {
    actionsHtml = `
      <div style="display:flex; gap:0.6rem; flex-wrap:wrap;">
        <button class="btn btn-danger act-delete">Удалить заявку</button>
      </div>
    `;
  }

  return `
    <div class="kv">
      <span class="k">Ребёнок</span><span>${escapeHtml(childFullName(r))}, дата рождения ${fmtDate(r.birth_date)}</span>
      ${r.current_school ? `<span class="k">Текущая школа</span><span>${escapeHtml(r.current_school)}</span>` : ''}
      <span class="k">Родитель</span><span>${escapeHtml(r.parent_name)}</span>
      <span class="k">Телефон</span><span>${escapeHtml(r.phone)}</span>
      <span class="k">Email</span><span>${escapeHtml(r.email)}</span>
      ${r.why_school ? `<span class="k">Почему «Мир»</span><span>${escapeHtml(r.why_school)}</span>` : ''}
      ${r.why_you ? `<span class="k">Почему именно он(а)</span><span>${escapeHtml(r.why_you)}</span>` : ''}
      <span class="k">Напоминание</span><span>${REMINDER_LABELS[r.reminder_offset] || r.reminder_offset || '—'}</span>
      <span class="k">Раунд согласования</span><span>${r.round} из 3</span>
      ${r.secretary_note ? `<span class="k">Заметка школы</span><span>${escapeHtml(r.secretary_note)}</span>` : ''}
    </div>
    ${actionsHtml}
    <span class="error-msg decide-error"></span>
  `;
}

function wireDetailActions(detailEl, r, card) {
  const errEl = detailEl.querySelector('.decide-error');
  const showErr = (msg) => { if (errEl) { errEl.textContent = msg; errEl.classList.add('show'); } };

  const approveBtn = detailEl.querySelector('.act-approve');
  if (approveBtn) approveBtn.addEventListener('click', async () => {
    try {
      const resp = await apiFetch(`/api/secretary/requests/${r.id}/decide`, {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ action: 'approve' }),
      });
      const d = await resp.json();
      if (!resp.ok) throw new Error(d.error);
      await refreshCardDetail(r.id, card);
    } catch (e) { showErr(e.message); }
  });

  const rejectBtn = detailEl.querySelector('.act-reject');
  if (rejectBtn) rejectBtn.addEventListener('click', async () => {
    try {
      const resp = await apiFetch(`/api/secretary/requests/${r.id}/decide`, {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ action: 'reject' }),
      });
      const d = await resp.json();
      if (!resp.ok) throw new Error(d.error);
      await refreshCardDetail(r.id, card);
    } catch (e) { showErr(e.message); }
  });

  const proposeToggle = detailEl.querySelector('.act-propose-toggle');
  const proposeForm = detailEl.querySelector('.propose-form');
  if (proposeToggle) proposeToggle.addEventListener('click', () => {
    proposeForm.classList.toggle('open');
  });

  const proposeSubmit = detailEl.querySelector('.act-propose-submit');
  if (proposeSubmit) proposeSubmit.addEventListener('click', async () => {
    const date = detailEl.querySelector('.propose-date').value;
    const time = detailEl.querySelector('.propose-time').value;
    const note = detailEl.querySelector('.propose-note').value;
    if (!date || !time) { showErr('Укажите дату и время.'); return; }
    try {
      const resp = await apiFetch(`/api/secretary/requests/${r.id}/decide`, {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ action: 'propose', date, time, note }),
      });
      const d = await resp.json();
      if (!resp.ok) throw new Error(d.error);
      await refreshCardDetail(r.id, card);
    } catch (e) { showErr(e.message); }
  });

  const deleteBtn = detailEl.querySelector('.act-delete');
  if (deleteBtn) deleteBtn.addEventListener('click', async () => {
    if (!confirm('Удалить эту отклонённую заявку без возможности восстановления?')) return;
    try {
      const resp = await apiFetch(`/api/secretary/requests/${r.id}`, { method: 'DELETE' });
      const d = await resp.json();
      if (!resp.ok) throw new Error(d.error);
      openDetailIds.delete(r.id);
      allRequests = allRequests.filter((x) => x.id !== r.id);
      card.remove();
      renderStats(allRequests);
      updateEmptyState(el('reqList').children.length);
    } catch (e) { showErr(e.message); }
  });
}

// ---------------- export ----------------

el('exportBtn').addEventListener('click', async () => {
  const resp = await apiFetch('/api/secretary/export.csv');
  const blob = await resp.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'interview-requests.csv';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
});

// ---------------- polling ----------------

let pollTimer = null;
function startPolling() {
  loadList();
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(() => {
    // Пока секретарь смотрит/заполняет конкретную заявку — не перестраиваем
    // список поверх него (иначе введённые дату/время сносит на середине).
    if (openDetailIds.size > 0) return;
    loadList(true);
  }, POLL_MS);
}

// ---------------- init ----------------

if (sessionToken) {
  showPanel();
  startPolling();
  maybeShowNotifyBanner();
} else {
  showLogin();
}
</script>
</body>
